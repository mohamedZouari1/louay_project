<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Campus Map</title>
    <link rel="stylesheet" href="map.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ===== Mobile-optimized overrides for Android WebView ===== */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        .header { display: none !important; }
        .map-container { display: flex; height: 100vh; width: 100vw; }
        #map { width: 100vw !important; height: 100vh !important; }

        /* ===== Left sidebar (search, legend, controls) ===== */
        .sidebar {
            position: fixed !important;
            left: -95vw !important;
            top: 0 !important;
            width: 90vw !important;
            max-width: 400px !important;
            height: 100vh !important;
            max-height: 100vh !important;
            min-height: 100vh !important;
            bottom: 0 !important;
            z-index: 1001 !important;
            transition: left 0.3s cubic-bezier(.4,0,.2,1) !important;
            background: #fff !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
            box-shadow: 4px 0 20px rgba(0,0,0,0.25) !important;
            padding-bottom: 100px !important;
            border-right: none !important;
            border-bottom: none !important;
            flex-direction: column !important;
        }
        .sidebar.open { left: 0 !important; }

        /* ===== Menu toggle button ===== */
        .sidebar-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1002;
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white;
            border: none;
            border-radius: 14px;
            width: 48px; height: 48px;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(26,35,126,0.4);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .sidebar-toggle:active { transform: scale(0.9); }

        /* ===== Overlay ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .sidebar-overlay.open { display: block; }

        /* ===== BOTTOM SHEET for POI Details ===== */
        .bottom-sheet-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.3);
            z-index: 2000;
        }
        .bottom-sheet-overlay.open { display: block; }

        .bottom-sheet {
            position: fixed;
            bottom: -100vh;
            left: 0;
            width: 100vw;
            max-height: 85vh;
            z-index: 2001;
            background: #fff;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
            transition: bottom 0.35s cubic-bezier(.4,0,.2,1);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .bottom-sheet.open { bottom: 0; }

        .bottom-sheet-handle {
            width: 40px; height: 5px;
            background: #ccc;
            border-radius: 3px;
            margin: 12px auto 4px auto;
        }
        .bottom-sheet-close {
            position: absolute;
            top: 12px; right: 16px;
            background: #ef4444;
            color: #fff;
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(239,68,68,0.3);
        }
        .bottom-sheet-close:active { transform: scale(0.9); }

        .bottom-sheet-body {
            padding: 8px 20px 30px 20px;
        }
        .bottom-sheet-body .details-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .bottom-sheet-body .details-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #1a237e;
            margin: 0 0 6px 0;
        }
        .bottom-sheet-body .details-category {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .bottom-sheet-body .details-description {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.6;
            margin: 8px 0 16px 0;
        }
        .bottom-sheet-body .details-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .bottom-sheet-body .details-info-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 12px;
            border-left: 4px solid #6366f1;
        }
        .bottom-sheet-body .details-info-item i {
            color: #6366f1;
            width: 18px;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .bottom-sheet-body .details-info-item a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }
        .bottom-sheet-body .details-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .bottom-sheet-body .details-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .bottom-sheet-body .details-btn-primary {
            background: linear-gradient(135deg, #1a237e, #3949ab);
            color: white;
            box-shadow: 0 4px 12px rgba(26,35,126,0.3);
        }
        .bottom-sheet-body .details-btn-secondary {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: white;
            box-shadow: 0 4px 12px rgba(245,158,11,0.3);
        }

        /* ===== Leaflet popup disable (we use bottom sheet instead) ===== */
        .leaflet-popup { display: none !important; }

        /* ===== Hide details section in sidebar (we moved it to bottom sheet) ===== */
        .sidebar .details-section { display: none !important; }

        /* ===== Route line styling ===== */
        .route-info-bar {
            position: fixed;
            bottom: 0; left: 0;
            width: 100vw;
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white;
            padding: 14px 20px;
            z-index: 3000;
            display: none;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        }
        .route-info-bar.open { display: flex; align-items: center; justify-content: space-between; }
        .route-info-bar button {
            background: #ef4444; color: white; border: none;
            padding: 8px 16px; border-radius: 10px; font-weight: 700;
            cursor: pointer;
        }

        /* ===== User location pulse ===== */
        .user-location-marker {
            width: 20px; height: 20px;
            background: #4285f4;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 6px rgba(66,133,244,0.25), 0 2px 8px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(66,133,244,0.4), 0 2px 8px rgba(0,0,0,0.3); }
            70% { box-shadow: 0 0 0 16px rgba(66,133,244,0), 0 2px 8px rgba(0,0,0,0.3); }
            100% { box-shadow: 0 0 0 0 rgba(66,133,244,0), 0 2px 8px rgba(0,0,0,0.3); }
        }
    </style>
</head>
<body>
    <!-- Mobile sidebar toggle -->
    <button class="sidebar-toggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <div class="map-container">
        <aside class="sidebar" id="sidebar">
            <!-- Search Section -->
            <div class="sidebar-section search-section">
                <h3 class="sidebar-title">
                    <i class="fas fa-search"></i> Search Location
                </h3>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search buildings, facilities..." />
                    <button class="search-btn" onclick="searchLocation()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>

            <!-- Location Details Section (hidden, kept for JS compatibility) -->
            <div id="locationDetailsSection" class="sidebar-section details-section" style="display: none;">
                <div class="details-header">
                    <h3 class="sidebar-title">
                        <i class="fas fa-info-circle"></i> Location Details
                    </h3>
                    <button class="close-details" onclick="closeLocationDetails()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="locationDetailsContent" class="details-content"></div>
            </div>

            <!-- Map Controls -->
            <div class="sidebar-section controls-section">
                <h3 class="sidebar-title">
                    <i class="fas fa-sliders-h"></i> Map Controls
                </h3>
                <div class="control-group">
                    <label class="control-label">
                        <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
                        <span><i class="fas fa-moon"></i> Dark Mode</span>
                    </label>
                </div>
                <div class="layer-selector">
                    <label>Map Style:</label>
                    <select id="layerSelect" onchange="changeMapLayer()">
                        <option value="streets">Streets</option>
                        <option value="satellite">Satellite</option>
                        <option value="terrain">Terrain</option>
                    </select>
                </div>
            </div>

            <!-- Map Legend -->
            <div class="sidebar-section legend-section">
                <h3 class="sidebar-title">
                    <i class="fas fa-map-signs"></i> Map Legend
                </h3>
                <div id="legendContent" class="legend-content"></div>
            </div>

            <!-- Favorites -->
            <div class="sidebar-section favorites-section">
                <h3 class="sidebar-title">
                    <i class="fas fa-star"></i> My Favorite Places
                </h3>
                <div id="favoritesList" class="favorites-list">
                    <p class="empty-message">No favorite places yet. Click the star icon on any location!</p>
                </div>
            </div>
        </aside>

        <div id="map" class="map"></div>
    </div>

    <!-- Bottom Sheet for POI Details -->
    <div class="bottom-sheet-overlay" id="bottomSheetOverlay" onclick="closeBottomSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="bottom-sheet-handle"></div>
        <button class="bottom-sheet-close" onclick="closeBottomSheet()">
            <i class="fas fa-times"></i>
        </button>
        <div class="bottom-sheet-body" id="bottomSheetBody">
        </div>
    </div>

    <!-- Route info bar -->
    <div class="route-info-bar" id="routeInfoBar">
        <span id="routeInfoText"></span>
        <button onclick="clearRoute()">✕ Close</button>
    </div>

    <!-- Locate me button -->
    <button style="position:fixed;bottom:24px;right:16px;z-index:1002;width:48px;height:48px;border-radius:50%;background:white;border:none;box-shadow:0 4px 16px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;" onclick="locateMe()">
        <i class="fas fa-crosshairs" style="color:#4285f4;"></i>
    </button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="universityFloorData.js"></script>
    <script src="map.js"></script>
    <script src="universityPolygons.js"></script>
    <script>
        // ===== Global state =====
        let userMarker = null;
        let userLat = null, userLng = null;
        let routeLine = null;
        let destMarker = null;

        // ===== Sidebar =====
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('open');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
        }

        // ===== Bottom Sheet =====
        function openBottomSheet() {
            document.getElementById('bottomSheet').classList.add('open');
            document.getElementById('bottomSheetOverlay').classList.add('open');
        }
        function closeBottomSheet() {
            document.getElementById('bottomSheet').classList.remove('open');
            document.getElementById('bottomSheetOverlay').classList.remove('open');
        }

        // ===== GPS Location =====
        function locateMe() {
            if (!navigator.geolocation) { alert('GPS not available'); return; }
            navigator.geolocation.getCurrentPosition(function(pos) {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                updateUserMarker();
                map.setView([userLat, userLng], 17);
            }, function(err) {
                alert('Could not get your location. Make sure GPS is enabled.');
            }, { enableHighAccuracy: true });
        }

        function updateUserMarker() {
            if (!userLat || !map) return;
            if (userMarker) map.removeLayer(userMarker);
            const icon = L.divIcon({
                className: 'user-loc-icon',
                html: '<div class="user-location-marker"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            userMarker = L.marker([userLat, userLng], { icon: icon, zIndexOffset: 1000 }).addTo(map);
            userMarker.bindPopup('<b>📍 You are here</b>');
        }

        // Start watching location
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(pos) {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                updateUserMarker();
            }, function(){}, { enableHighAccuracy: true, maximumAge: 10000 });
        }

        // ===== OSRM Directions =====
        function getDirections(destLat, destLng) {
            closeBottomSheet();
            if (!navigator.geolocation) { alert('GPS not available'); return; }

            // Show loading
            document.getElementById('routeInfoText').textContent = '📍 Getting your location...';
            document.getElementById('routeInfoBar').classList.add('open');

            navigator.geolocation.getCurrentPosition(function(pos) {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                updateUserMarker();

                // Call OSRM
                const url = `https://router.project-osrm.org/route/v1/foot/${userLng},${userLat};${destLng},${destLat}?overview=full&geometries=geojson&steps=true`;

                fetch(url)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.routes || data.routes.length === 0) {
                            document.getElementById('routeInfoText').textContent = '❌ No route found';
                            return;
                        }
                        const route = data.routes[0];
                        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

                        // Clear old route
                        if (routeLine) map.removeLayer(routeLine);

                        // Draw route
                        routeLine = L.polyline(coords, {
                            color: '#4285f4',
                            weight: 6,
                            opacity: 0.85,
                            lineCap: 'round',
                            lineJoin: 'round',
                            dashArray: null
                        }).addTo(map);

                        // Add destination marker (track it for cleanup)
                        if (destMarker) map.removeLayer(destMarker);
                        destMarker = L.marker([destLat, destLng]).addTo(map).bindPopup('🏁 Destination');

                        // Fit bounds
                        map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });

                        // Show info
                        const distKm = (route.distance / 1000).toFixed(1);
                        const timeMin = Math.ceil(route.duration / 60);
                        document.getElementById('routeInfoText').textContent =
                            `🚶 ${distKm} km · ${timeMin} min walking`;
                    })
                    .catch(err => {
                        document.getElementById('routeInfoText').textContent = '❌ Routing error';
                        console.error(err);
                    });
            }, function() {
                document.getElementById('routeInfoText').textContent = '❌ Could not get location';
            }, { enableHighAccuracy: true });
        }

        function clearRoute() {
            if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
            if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
            document.getElementById('routeInfoBar').classList.remove('open');
        }


        // ===== Override showLocationDetails to use bottom sheet =====
        document.addEventListener('DOMContentLoaded', function() {
            const checkAndPatch = setInterval(function() {
                if (typeof showLocationDetails === 'function' && !window._patched) {
                    window._patched = true;

                    const _getImg = (typeof getLocationImage === 'function') ? getLocationImage : function(){ return null; };

                    window.showLocationDetails = function(feature) {
                        const props = feature.properties;
                        const isFavorite = (typeof favorites !== 'undefined') && favorites.some(fav => fav.name === props.name);
                        let imageUrl = _getImg(props.category, props.name);

                        // Fix image paths with spaces
                        if (imageUrl) {
                            imageUrl = encodeURI(imageUrl);
                        }

                        let html = '';

                        // Image
                        if (imageUrl) {
                            html += `<img src="${imageUrl}" alt="${props.name}" class="details-image" onerror="this.style.display='none'">`;
                        }

                        // Title + Category
                        html += `<h2 class="details-title">${props.name}</h2>`;
                        html += `<span class="details-category">${props.category || 'General'}</span>`;

                        // Description
                        if (props.description) {
                            html += `<p class="details-description">${props.description}</p>`;
                        }

                        // Info items
                        html += '<div class="details-info">';
                        if (props.hours) {
                            html += `<div class="details-info-item">
                                <i class="fas fa-clock"></i>
                                <span><strong>Hours:</strong><br>${props.hours}</span>
                            </div>`;
                        }
                        if (props.phone) {
                            html += `<div class="details-info-item">
                                <i class="fas fa-phone"></i>
                                <span><strong>Phone:</strong><br><a href="tel:${props.phone}">${props.phone}</a></span>
                            </div>`;
                        }
                        if (props.website) {
                            html += `<div class="details-info-item">
                                <i class="fas fa-globe"></i>
                                <span><strong>Website:</strong><br><a href="${props.website}" target="_blank">Visit Website</a></span>
                            </div>`;
                        }
                        if (props.address) {
                            html += `<div class="details-info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <span><strong>Address:</strong><br>${props.address}</span>
                            </div>`;
                        }
                        html += '</div>';

                        // Action buttons
                        const featureJson = JSON.stringify(feature).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                        html += `<div class="details-actions">
                            <button class="details-btn details-btn-primary" onclick="getDirections(${feature.geometry.coordinates[1]}, ${feature.geometry.coordinates[0]})">
                                <i class="fas fa-directions"></i> Directions
                            </button>
                            <button class="details-btn details-btn-secondary" onclick="toggleFavorite('${props.name.replace(/'/g, "\\'")}', '${props.category}');">
                                <i class="fas fa-star"></i> ${isFavorite ? 'Unfavorite' : 'Favorite'}
                            </button>
                        </div>`;

                        document.getElementById('bottomSheetBody').innerHTML = html;
                        closeSidebar();
                        openBottomSheet();
                    };



                    clearInterval(checkAndPatch);
                }
            }, 200);
        });
    </script>
</body>
</html>
